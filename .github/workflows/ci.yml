name: ci

on:
  workflow_call:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup v6.1.0
        with:
          version: 11.1.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server/frontend

      - name: Test frontend
        run: pnpm test
        working-directory: server/frontend

      - name: Build frontend
        run: pnpm build
        working-directory: server/frontend

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server/backend

      - name: Test backend (includes build)
        run: npm test
        working-directory: server/backend

  automation:
    name: automation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"

      - name: Run automation unit tests
        run: python -m unittest discover -s automation/tests -v

  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"

      - name: Test release and deployment safety
        run: python -m unittest discover -s server/infra/tests -p 'test_*.py' -v

      - name: Build web image
        run: docker build --platform linux/amd64 -f server/frontend/Dockerfile -t powercode-web:test server

      - name: Build API image
        run: docker build --platform linux/amd64 -f server/backend/Dockerfile -t powercode-api:test server

      - name: Smoke test login, API and SSE
        run: python server/infra/tests/smoke.py --compose-file server/infra/compose.yaml --web-image powercode-web:test --api-image powercode-api:test
