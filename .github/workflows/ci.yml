name: ci

on:
  # 기능 브랜치는 PR 실행만 받는다. push는 병합 결과(dev·main)만 검사해 PR push마다 push·pull_request 두 번 도는 중복을 없앤다.
  push:
    branches:
      - dev
      - main
  # closed·ready_for_review·converted_to_draft는 코드 변경이 없지만, ci 완료(workflow_run)로 notion-sync를 바로 깨우는 신호라 유지한다.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup v6.1.0
        with:
          version: 11.1.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server/frontend

      - name: Test frontend
        run: pnpm test
        working-directory: server/frontend

      - name: Build frontend
        run: pnpm build
        working-directory: server/frontend

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/backend/package-lock.json

      # 백엔드 시험이 Python으로 Detector hash 함수(detector-hash-v3)·독립 hash 구현을 부른다. 실행 이미지에 기대지 않고 버전을 고정한다.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: npm ci
        working-directory: server/backend

      - name: Test backend (includes build)
        run: npm test
        working-directory: server/backend

  automation:
    name: automation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"

      - name: Run automation unit tests
        run: python -m unittest discover -s automation/tests -v

  webhook:
    name: webhook
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/webhook/package-lock.json

      - name: Install webhook dependencies
        run: npm ci
        working-directory: automation/webhook

      - name: Check webhook types
        run: npm run typecheck
        working-directory: automation/webhook

      - name: Test webhook
        run: npm test
        working-directory: automation/webhook

      - name: Validate webhook deployment bundle
        run: npm run bundle
        working-directory: automation/webhook

  # worker-runtime(수 분 소요) 실행 여부만 정한다. 다른 job은 조건 없이 그대로 돈다.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      worker-runtime: ${{ steps.filter.outputs.worker-runtime }}
    steps:
      # PR 실행의 기본 checkout은 병합 시험 commit(refs/pull/N/merge)이다. 첫 부모가 대상 브랜치 끝이라 깊이 2면 PR 변경 파일을 구할 수 있다.
      - name: Check out PR merge commit with its base parent
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Decide worker-runtime from changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          # worker-runtime이 실제로 읽거나 실행하는 경로: worker 코드·requirements, infra migration·nginx·DB 준비, contracts schema,
          # backend build·integration 시험, research bundle 원천(LFS 가중치 포함), 이 workflow 자체.
          WORKER_RUNTIME_PATHS: '^(server/(worker|infra|contracts|backend)/|research/|\.gitattributes$|\.github/workflows/ci\.yml$)'
        run: |
          decide() {
            echo "worker-runtime=$1" >> "$GITHUB_OUTPUT"
            echo "worker-runtime: $1 ($2)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            decide true "$EVENT_NAME $GITHUB_REF always runs"
            exit 0
          fi
          # closed는 코드 변경이 없다. 병합분은 뒤이은 dev·main push 실행이 전부 검사하므로 건너뛴다(ci는 성공으로 끝나 notion-sync 신호 유지).
          if [ "$EVENT_ACTION" = "closed" ]; then
            decide false "pull_request closed, merged code is checked by the dev/main push run"
            exit 0
          fi
          # 병합 commit이 아니거나 diff를 못 구하면 건너뛰지 않고 실행한다. --no-renames: 이동한 파일은 옛 경로·새 경로를 모두 본다.
          # core.quotePath=false: 한글 등 비ASCII 경로를 따옴표·8진 escape 없이 그대로 출력해 경로 정규식과 맞춘다.
          changed_files="$RUNNER_TEMP/changed-files.txt"
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null || ! git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD > "$changed_files"; then
            decide true "changed paths unavailable, running for safety"
            exit 0
          fi
          echo "changed files: $(grep -c . "$changed_files" || true)"
          # -m 20: 일치 경로를 최대 20개만 보여 준다(pipe 없이 pipefail 영향 회피).
          if grep -E -m 20 "$WORKER_RUNTIME_PATHS" "$changed_files"; then
            decide true "runtime paths changed"
          else
            decide false "no runtime path changed"
          fi

  worker-runtime:
    name: worker-runtime
    needs: changes
    if: needs.changes.outputs.worker-runtime == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNTIME_TEST_ADMIN_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_research_pipeline
      RESEARCH_BUNDLE_ROOT: /tmp/powercode-research-runtime
    steps:
      - name: Check out runtime source and research weights
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install CPU runtime
        run: pip install -r server/worker/requirements.txt
      - name: Validate upload proxy configuration
        run: >-
          docker run --rm --network none --entrypoint nginx
          --mount type=bind,source="$PWD/server/infra/nginx.conf",destination=/etc/nginx/conf.d/default.conf,readonly
          nginx:1.28-alpine -t
      - name: Prepare fresh isolated databases
        run: python server/infra/tests/prepare-runtime-db.py
      - name: Export research runtime
        run: python server/worker/research_bundle.py --repository . --output "$RESEARCH_BUNDLE_ROOT"
      - name: Unit contracts and concurrency
        run: python -m unittest discover -s server/worker/tests -p 'test_*.py'
      - name: Actual CPU research pipeline with explicit generation fixture
        run: python server/worker/tests/integration_research_pipeline.py
      - name: Service split, modes and recovery
        run: python server/worker/tests/integration_service_transition.py
      - name: Detection decision v04 attempt, interims and v03 regression
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_detection_decision
        run: python server/worker/tests/integration_detection_decision.py
      - name: Relation rule recheck search (rule set v3)
        env:
          RECHECK_TEST_ADMIN_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
        run: python server/worker/tests/integration_relation_recheck.py
      - name: Detector multiple workers on one detection queue
        env:
          WORKERS_TEST_ADMIN_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
        run: python server/worker/tests/integration_detector_workers.py
      - name: Incident grouping job (layer C)
        env:
          INCIDENTS_TEST_ADMIN_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
        run: python server/worker/tests/integration_incidents.py
      - name: Continuous source API collection fixture and latency samples
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_api_collection.py
      - name: CPU CSV and PostgreSQL demo replay
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_demo_replay.py
      - name: Demo SQL role boundaries and initial-schema input
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_demo_permissions.py
      - name: Build API for runtime integration
        working-directory: server/backend
        run: |
          npm ci
          npm run build
      - name: Shared API and CSV full pipeline with explicit Rule selection
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_switchable_inputs.py
      - name: Trainer service fit, API and failure recovery contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_trainer_service
        run: python server/worker/tests/integration_trainer_service_contract.py
      - name: Model version v3 output, operational revisions and fail-closed reads
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_trainer_service
        run: python server/worker/tests/integration_model_version_v3.py
      - name: Shared input Collector role boundaries
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_input_roles.py
      - name: Non-synthetic metrics, selection and manual approval integration
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_metrics_service
        run: |
          python server/worker/tests/integration_metrics_service.py --utilities
          python server/worker/tests/integration_metrics_service.py
      - name: Job API contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: node server/backend/tests/jobs.integration.mjs
      - name: Feature set registration API under runtime role
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_feature_sets_service
        run: node server/backend/tests/feature-sets.integration.mjs
      - name: Operations read API contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_operations_service
        run: node server/backend/tests/operations.integration.mjs
      - name: Operations API runtime-role grants
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_operations_service
        run: node server/backend/tests/operations-grants.integration.mjs
      - name: Analysis decision read API contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_analysis_service
        run: node server/backend/tests/analysis.integration.mjs
      - name: Analysis API runtime-role grants
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_analysis_service
        run: node server/backend/tests/analysis-grants.integration.mjs
      - name: User settings and notifications API under runtime role
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_notifications_service
        run: node server/backend/tests/notifications.integration.mjs
      - name: Email alerts API and runner under runtime role
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_email_alerts_service
        run: node server/backend/tests/email-alerts.integration.mjs
      - name: Response code dictionary import and API under runtime role
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_response_codes_service
        run: node server/backend/tests/response-codes.integration.mjs
      - name: Rule set API contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_rule_set_service
        run: node server/backend/tests/rule-set.integration.mjs
      - name: Rule set API runtime-role grants
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_rule_set_service
        run: node server/backend/tests/rule-set-grants.integration.mjs
      - name: Model version API under runtime role
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_rule_set_models
        run: node server/backend/tests/model-versions.integration.mjs
      - name: Active model set and operations method status API
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_active_models_service
        run: node server/backend/tests/active-models.integration.mjs
      - name: Synthetic profiles, fixed-model evaluation and recovery
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_synthetic_service
        run: |
          node server/backend/tests/synthetic-catalog-parity.mjs
          python server/worker/tests/integration_synthetic_service.py
      - name: Prepared CSV import, training, evaluation and isolation
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_prepared_csv_service
        run: python server/worker/tests/integration_prepared_csv_service.py
      - name: Saved decision SSE and requested explanation contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_research_pipeline
        run: node server/backend/tests/service-transition.integration.mjs
