name: ci

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup v6.1.0
        with:
          version: 11.1.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server/frontend

      - name: Test frontend
        run: pnpm test
        working-directory: server/frontend

      - name: Build frontend
        run: pnpm build
        working-directory: server/frontend

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server/backend

      - name: Test backend (includes build)
        run: npm test
        working-directory: server/backend

  automation:
    name: automation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"

      - name: Run automation unit tests
        run: python -m unittest discover -s automation/tests -v

  webhook:
    name: webhook
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/webhook/package-lock.json

      - name: Install webhook dependencies
        run: npm ci
        working-directory: automation/webhook

      - name: Check webhook types
        run: npm run typecheck
        working-directory: automation/webhook

      - name: Test webhook
        run: npm test
        working-directory: automation/webhook

      - name: Validate webhook deployment bundle
        run: npm run bundle
        working-directory: automation/webhook

  worker-runtime:
    name: worker-runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNTIME_TEST_ADMIN_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_research_pipeline
      RESEARCH_BUNDLE_ROOT: /tmp/powercode-research-runtime
    steps:
      - name: Check out runtime source and research weights
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install CPU runtime
        run: pip install -r server/worker/requirements.txt
      - name: Prepare fresh isolated databases
        run: python server/infra/tests/prepare-runtime-db.py
      - name: Export research runtime
        run: python server/worker/research_bundle.py --repository . --output "$RESEARCH_BUNDLE_ROOT"
      - name: Unit contracts and concurrency
        run: python -m unittest discover -s server/worker/tests -p 'test_*.py'
      - name: Actual CPU research pipeline with explicit generation fixture
        run: python server/worker/tests/integration_research_pipeline.py
      - name: Service split, modes and recovery
        run: python server/worker/tests/integration_service_transition.py
      - name: Continuous source API collection fixture and latency samples
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_api_collection.py
      - name: CPU CSV and PostgreSQL demo replay
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_demo_replay.py
      - name: Demo SQL role boundaries and initial-schema input
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_demo_permissions.py
      - name: Build API for runtime integration
        working-directory: server/backend
        run: |
          npm ci
          npm run build
      - name: Shared API and CSV full pipeline with explicit Rule selection
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_switchable_inputs.py
      - name: Shared input Collector role boundaries
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: python server/worker/tests/integration_input_roles.py
      - name: Job API contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_pipeline
        run: node server/backend/tests/jobs.integration.mjs
      - name: Saved decision SSE and requested explanation contract
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/qa_research_pipeline
        run: node server/backend/tests/service-transition.integration.mjs
